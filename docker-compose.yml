# Local development stack for BY RASLAN ERP (Laravel 12 + MySQL 8 + Redis).
# Usage: docker compose up -d   |   docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: byraslan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: byraslan
      MYSQL_USER: byraslan
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - byraslan-mysql:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: byraslan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: byraslan-pma
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  byraslan-mysql: